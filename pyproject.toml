[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge"
version = "0.1.0"
description = "Application-layer protocol documents to Specs and generated C projects"
requires-python = ">=3.11"
dependencies = ["openai==1.97.0", "jsonschema==4.24.0"]

[project.scripts]
specforge = "specforge.__main__:main"

[tool.setuptools]
packages = ["specforge"]

